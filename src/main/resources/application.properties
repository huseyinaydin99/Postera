spring.application.name=Postera
spring.datasource.url=${POSTERA_DB_URL}
spring.datasource.username=${POSTERA_DB_USERNAME}
spring.datasource.password=${POSTERA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
postera.uploads.profile-directory=${POSTERA_PROFILE_IMAGE_DIRECTORY:uploads/profile}
postera.app.base-url=${POSTERA_APP_BASE_URL:http://localhost:8080}
spring.mail.host=${POSTERA_MAIL_HOST:localhost}
spring.mail.port=${POSTERA_MAIL_PORT:1025}
spring.mail.username=${POSTERA_MAIL_USERNAME:}
spring.mail.password=${POSTERA_MAIL_PASSWORD:}
postera.admin.email=${POSTERA_ADMIN_EMAIL:}
