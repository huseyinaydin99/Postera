spring.application.name=Postera

# ===============================
# Database
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/postera
spring.datasource.username=root
spring.datasource.password=toor
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.cache=false

# ===============================
# Server
# ===============================
server.port=8080

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

postera.uploads.profile-directory=uploads/profile
postera.app.base-url=http://localhost:8080

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=

postera.admin.email=admin@postera.com