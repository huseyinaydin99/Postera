<div th:fragment="messageList(messages, boxType)">
    <p th:if="${messages.empty}">Bu klasörde henüz mesaj yok.</p>
    <div th:if="${boxType == 'trash' and !messages.empty}" class="trash-toolbar" data-trash-toolbar>
        <button type="button" class="trash-toolbar-button" data-selection-toggle>
            <span class="material-symbols-outlined">checklist</span> Seçimi aktifleştir
        </button>
        <form class="trash-empty-form" th:action="@{/messages/trash/empty}" method="post" data-confirm-action="Çöp kutusundaki tüm mesajlar kalıcı olarak silinecek.">
            <button type="submit" class="trash-toolbar-button trash-danger-button">
                <span class="material-symbols-outlined">delete_forever</span> Çöp kutusunu boşalt
            </button>
        </form>
    </div>
    <div th:if="${boxType != 'trash' and !messages.empty}" class="trash-toolbar" data-selection-toolbar>
        <button type="button" class="trash-toolbar-button" data-selection-toggle>
            <span class="material-symbols-outlined">checklist</span> Seçimi aktifleştir
        </button>
    </div>
    <form th:if="${boxType == 'trash' and !messages.empty}" id="trash-selection-form"
          th:action="@{/messages/trash/selected/delete}" method="post" data-selection-form data-confirm-action="Seçilen mesajlar kalıcı olarak silinecek.">
        <div class="trash-selection-bar" hidden data-selection-bar>
            <label class="select-all-control" for="select-all-trash">
                <input id="select-all-trash" type="checkbox" data-select-all disabled>
                <span>Tümünü seç</span>
            </label>
            <span data-selected-count>0 mesaj seçildi</span>
            <button type="submit" class="trash-danger-button" disabled data-delete-selected>
                Seçilenleri sil
            </button>
            <button type="button" class="trash-toolbar-button" data-selection-cancel>İptal</button>
        </div>
        <ul class="message-list">
            <li class="message-list-header" aria-hidden="true"><span></span><span>Kişi</span><span>Konu</span><span>Okundu mu?</span><span>Tarih</span><span></span></li>
            <li th:each="message : ${messages.content}" class="message-list-item" th:classappend="${!message.read} ? ' message-list-item-unread'">
                <label class="message-selector" hidden data-message-selector>
                    <input type="checkbox" name="messageIds" th:value="${message.id}" disabled data-message-checkbox>
                    <span class="visually-hidden">Mesajı seç</span>
                </label>
                <a th:href="@{/messages/{id}(id=${message.id})}">
                    <img class="message-list-avatar" th:src="${message.counterpartProfileImageUrl != null ? message.counterpartProfileImageUrl : '/images/default-avatar.svg'}" th:alt="${message.counterpartName + ' profil fotoğrafı'}">
                    <span class="message-list-copy"><span class="message-list-name" th:text="${message.counterpartName}"></span><small th:text="${message.preview}"></small></span>
                    <span class="message-list-subject"><span th:if="${message.important}" aria-label="Önemli mesaj">★ </span><span th:text="${message.subject}"></span></span>
                    <span class="message-read-status" th:title="${message.read ? 'Okundu' : 'Okunmadı'}" th:text="${message.read ? '🟢 ✓' : '🔴 −'}"></span>
                    <time th:text="${#temporals.format(message.sentAt, 'dd.MM.yyyy HH:mm')}"></time>
                </a>
            </li>
        </ul>
    </form>
    <form th:if="${boxType != 'trash' and !messages.empty}" th:action="@{/messages/selected/trash}" method="post" data-selection-form data-confirm-action="Seçilen mesajlar çöp kutusuna taşınacak.">
        <input type="hidden" name="boxType" th:value="${boxType}">
        <div class="trash-selection-bar" hidden data-selection-bar>
            <label class="select-all-control" for="select-all-messages">
                <input id="select-all-messages" type="checkbox" data-select-all disabled>
                <span>Tümünü seç</span>
            </label>
            <span data-selected-count>0 mesaj seçildi</span>
            <button type="submit" class="trash-danger-button" disabled data-delete-selected>
                Seçilenleri sil
            </button>
            <button type="button" class="trash-toolbar-button" data-selection-cancel>İptal</button>
        </div>
        <ul class="message-list">
            <li class="message-list-header" aria-hidden="true"><span></span><span>Kişi</span><span>Konu</span><span>Okundu mu?</span><span>Tarih</span><span></span></li>
            <li th:each="message : ${messages.content}" class="message-list-item" th:classappend="${!message.read} ? ' message-list-item-unread'">
                <label class="message-selector" hidden data-message-selector>
                    <input type="checkbox" name="messageIds" th:value="${message.id}" disabled data-message-checkbox>
                    <span class="visually-hidden">Mesajı seç</span>
                </label>
                <a th:href="@{/messages/{id}(id=${message.id})}">
                    <img class="message-list-avatar" th:src="${message.counterpartProfileImageUrl != null ? message.counterpartProfileImageUrl : '/images/default-avatar.svg'}" th:alt="${message.counterpartName + ' profil fotoğrafı'}">
                    <span class="message-list-copy"><span class="message-list-name" th:text="${message.counterpartName}"></span><small th:text="${message.preview}"></small></span>
                    <span class="message-list-subject"><span th:if="${message.important}" aria-label="Önemli mesaj">★ </span><span th:text="${message.subject}"></span></span>
                    <span class="message-read-status" th:title="${message.read ? 'Okundu' : 'Okunmadı'}" th:text="${message.read ? '🟢 ✓' : '🔴 −'}"></span>
                    <time th:text="${#temporals.format(message.sentAt, 'dd.MM.yyyy HH:mm')}"></time>
                </a>
                <button type="button" class="message-delete-button" th:attr="data-delete-form=${'delete-message-' + message.id}" title="Çöp kutusuna taşı"><span class="material-symbols-outlined">delete</span><span>Sil</span></button>
            </li>
        </ul>
    </form>
    <div th:if="${boxType != 'trash' and !messages.empty}" hidden>
        <form th:each="message : ${messages.content}" th:id="${'delete-message-' + message.id}" th:action="@{/messages/{id}/trash(id=${message.id})}" method="post">
            <input type="hidden" name="returnTo" th:value="${boxType}">
        </form>
    </div>
</div>
