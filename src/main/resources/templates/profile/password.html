<!DOCTYPE html>
<html lang="tr" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"><title>Şifre değiştir | Postera</title></head>
<body>
<header th:replace="~{fragments/navigation :: mainNavigation}"></header>
<main><h1>Şifre değiştir</h1>
    <form th:action="@{/profile/password}" th:object="${passwordChangeRequest}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" role="alert"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div>
        <label for="currentPassword">Mevcut şifre</label><input id="currentPassword" th:field="*{currentPassword}" type="password" autocomplete="current-password"><p th:errors="*{currentPassword}"></p>
        <label for="newPassword">Yeni şifre</label><input id="newPassword" th:field="*{newPassword}" type="password" autocomplete="new-password"><p th:errors="*{newPassword}"></p>
        <label for="newPasswordConfirmation">Yeni şifre tekrarı</label><input id="newPasswordConfirmation" th:field="*{newPasswordConfirmation}" type="password" autocomplete="new-password"><p th:errors="*{newPasswordConfirmation}"></p>
        <button type="submit">Şifreyi güncelle</button>
    </form>
</main></body></html>
