<!DOCTYPE html>
<html lang="tr" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>Profilim | Postera</title>
</head>
<body>
<header th:replace="~{fragments/navigation :: mainNavigation}"></header>
<main>
    <section aria-labelledby="profile-title">
        <h1 id="profile-title">Profilim</h1>
        <p>E-posta adresiniz: <strong th:text="${email}"></strong></p>
        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
            <div>
                <strong>Profil Fotoğrafı:</strong><br>
                <img th:if="${profileImageUrl}" th:src="${profileImageUrl}" alt="Profil görseli" width="96" height="96" style="object-fit: cover; border-radius: 50%;">
            </div>
            <div>
                <strong>Kapak Fotoğrafı:</strong><br>
                <img th:if="${coverImageUrl}" th:src="${coverImageUrl}" alt="Kapak görseli" width="200" height="96" style="object-fit: cover;">
            </div>
        </div>
        <p th:if="${param.updated}" role="status">Profil bilgileriniz güncellendi.</p>
        <p th:if="${param.passwordChanged}" role="status">Şifreniz güncellendi.</p>
        <p><a th:href="@{/profile/password}">Şifremi değiştir</a> · <a th:href="@{/profile/email}">E-posta adresimi değiştir</a> · <a href="#" data-blocked-users-toggle>Engellenenler</a></p>

        <!-- Blocked Users Modal (matching ped-modal structure) -->
        <div class="ped-backdrop" id="blockedUsersBackdrop" style="opacity: 0; pointer-events: none; transition: opacity 0.18s ease; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); z-index: 910;"></div>
        <div class="ped-modal" id="blockedUsersModal" role="dialog" aria-modal="true" aria-label="Engellenen Kişiler">
            <div class="ped-header">
                <span class="ped-title">Engellenen Kişiler</span>
                <button type="button" class="ped-close" data-blocked-users-close aria-label="Kapat">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="ped-body" id="blockedUsersList" style="min-height: 100px;">
                <div class="blocked-users-loading">Yükleniyor…</div>
            </div>
        </div>

        <form th:action="@{/profile}" th:object="${profileUpdateRequest}" method="post" enctype="multipart/form-data">
            <div th:if="${#fields.hasGlobalErrors()}" role="alert"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div>
            <div>
                <label for="firstName">Ad</label>
                <input id="firstName" th:field="*{firstName}" autocomplete="given-name" required>
                <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
            </div>
            <div>
                <label for="profileImage">Profil fotoğrafı</label>
                <input id="profileImage" th:field="*{profileImage}" type="file" accept="image/jpeg,image/png,image/webp">
                <p>JPG, PNG veya WEBP; en fazla 5 MB.</p>
            </div>
            <div>
                <label for="coverImage">Kapak fotoğrafı</label>
                <input id="coverImage" th:field="*{coverImage}" type="file" accept="image/jpeg,image/png,image/webp">
                <p>JPG, PNG veya WEBP; en fazla 5 MB.</p>
            </div>
            <div>
                <label for="lastName">Soyad</label>
                <input id="lastName" th:field="*{lastName}" autocomplete="family-name" required>
                <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
            </div>
            <button type="submit">Bilgileri güncelle</button>
        </form>
    </section>
</main>
<script th:src="@{/js/blocked-users.js}" defer></script>
</body>
</html>
