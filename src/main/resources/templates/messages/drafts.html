<!DOCTYPE html>
<html lang="tr" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taslaklar | Postera</title></head>
<body>
<header th:replace="~{fragments/navigation :: mainNavigation}"></header>
<main>
    <h1>Taslaklar</h1>
    <p th:if="${param.saved}" role="status">Taslağınız kaydedildi.</p>
    <p th:if="${bulkActionError}" role="alert" th:text="${bulkActionError}"></p>
    <p th:if="${bulkActionSuccess}" role="status" th:text="${bulkActionSuccess}"></p>
    <p th:if="${messages.empty}">Henüz taslak yok.</p>
    <div th:if="${!messages.empty}" class="trash-toolbar" data-selection-toolbar>
        <button type="button" class="trash-toolbar-button" data-selection-toggle>
            <span class="material-symbols-outlined">checklist</span> Seçimi aktifleştir
        </button>
    </div>
    <form th:if="${!messages.empty}" th:action="@{/messages/selected/trash}" method="post" data-selection-form>
        <input type="hidden" name="boxType" value="drafts">
        <div class="trash-selection-bar" hidden data-selection-bar>
            <label class="select-all-control" for="select-all-drafts"><input id="select-all-drafts" type="checkbox" data-select-all disabled><span>Tümünü seç</span></label>
            <span data-selected-count>0 mesaj seçildi</span>
            <button type="submit" class="trash-danger-button" disabled data-delete-selected onclick="return confirm('Seçilen taslaklar çöp kutusuna taşınacak. Devam etmek istiyor musunuz?');">Seçilenleri sil</button>
            <button type="button" class="trash-toolbar-button" data-selection-cancel>İptal</button>
        </div>
        <ul class="message-list">
            <li th:each="message : ${messages.content}" class="message-list-item">
                <label class="message-selector" hidden data-message-selector><input type="checkbox" name="messageIds" th:value="${message.id}" disabled data-message-checkbox><span class="visually-hidden">Taslağı seç</span></label>
                <a th:href="@{/messages/drafts/{id}/edit(id=${message.id})}">
                    <img class="message-list-avatar" th:src="${message.counterpartProfileImageUrl != null ? message.counterpartProfileImageUrl : '/images/default-avatar.svg'}" th:alt="${message.counterpartName + ' profil fotoğrafı'}">
                    <span class="message-list-copy"><strong th:text="${message.counterpartName}"></strong><small th:text="${message.preview}"></small></span>
                    <span class="message-list-subject" th:text="${message.subject}"></span>
                    <time th:text="${#temporals.format(message.sentAt, 'dd.MM.yyyy HH:mm')}"></time>
                </a>
            </li>
        </ul>
    </form>
</main>
<script th:src="@{/js/trash-selection.js}" defer></script>
</body>
</html>
