<!DOCTYPE html>
<html lang="tr" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title th:text="${message.subject} + ' | Postera'">Mesaj | Postera</title>
</head>
<body>
<header th:replace="~{fragments/navigation :: mainNavigation}"></header>
<main>
    <article>
        <h1 th:text="${message.subject}"></h1>
        <div class="message-participants">
            <div class="participant-card">
                <img th:src="${message.senderProfileImageUrl != null ? message.senderProfileImageUrl : '/images/default-avatar.svg'}"
                     th:alt="${message.senderName + ' profil fotoğrafı'}">
                <div><span>Gönderen</span><strong th:text="${message.senderName}"></strong><small th:text="${message.senderEmail}"></small></div>
            </div>
            <div class="participant-card">
                <img th:src="${message.receiverProfileImageUrl != null ? message.receiverProfileImageUrl : '/images/default-avatar.svg'}"
                     th:alt="${message.receiverName + ' profil fotoğrafı'}">
                <div><span>Alıcı</span><strong th:text="${message.receiverName}"></strong><small th:text="${message.receiverEmail}"></small></div>
            </div>
        </div>
        <p class="message-sent-at"><time th:text="${#temporals.format(message.sentAt, 'dd.MM.yyyy HH:mm')}"></time></p>
        <section class="conversation" aria-label="Mesaj konuşması">
            <div th:each="item : ${conversation}" class="conversation-message" th:classappend="${item.sentByCurrentUser} ? ' conversation-message-own' : ''">
                <img th:src="${item.senderProfileImageUrl != null ? item.senderProfileImageUrl : '/images/default-avatar.svg'}"
                     th:alt="${item.senderName + ' profil fotoğrafı'}">
                <div class="conversation-bubble">
                    <div><strong th:text="${item.senderName}"></strong><time th:text="${#temporals.format(item.sentAt, 'dd.MM.yyyy HH:mm')}"></time></div>
                    <div class="rich-message-body" th:utext="${item.body}"></div>
                    <div class="message-images" th:if="${!item.imageUrls.empty}">
                        <img th:each="imageUrl : ${item.imageUrls}" th:src="${imageUrl}" alt="Mesaja eklenen görsel">
                    </div>
                    <div class="message-attachment" th:if="${item.attachment != null}">
                        <a th:href="@{/messages/{messageId}/attachment/{attachmentId}(messageId=${item.id}, attachmentId=${item.attachment.id})}" class="attachment-link" th:download="${item.attachment.alias}" th:title="${'İndir: ' + item.attachment.alias}">
                            <span class="material-symbols-outlined attachment-icon">attach_file</span>
                            <div class="attachment-info">
                                <span class="attachment-name" th:text="${item.attachment.alias}">Dosya Adı</span>
                                <small class="attachment-size" th:text="${item.attachment.formattedSize}">1.2 MB</small>
                            </div>
                            <span class="material-symbols-outlined attachment-download-icon">download</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>
        <form th:if="${!message.draft}" id="reply-form" class="reply-form" th:action="@{/messages/{id}/reply(id=${message.id})}" th:object="${replyMessageRequest}" method="post" enctype="multipart/form-data">
            <label for="reply-body">Yanıtınız</label>
            <div class="rte-toolbar" role="toolbar" aria-label="Metin biçimlendirme araçları">
                <button type="button" data-rte-command="bold" title="Kalın"><strong>B</strong></button>
                <button type="button" data-rte-command="italic" title="İtalik"><em>I</em></button>
                <button type="button" data-rte-command="insertUnorderedList" title="Madde işaretli liste"><span class="material-symbols-outlined">format_list_bulleted</span></button>
                <button type="button" data-rte-command="insertOrderedList" title="Numaralı liste"><span class="material-symbols-outlined">format_list_numbered</span></button>
                <button type="button" data-rte-command="formatBlock" data-rte-value="p" title="Paragraf"><span class="material-symbols-outlined">format_paragraph</span></button>
                <button type="button" data-rte-toggle="emoji-picker" title="Emoji ekle">😊</button>
                <button type="button" data-rte-toggle="link-picker" title="Bağlantı ekle"><span class="material-symbols-outlined">link</span></button>
                <button type="button" data-rte-toggle="gif-picker" title="GIF ekle"><span class="material-symbols-outlined">gif_box</span></button>
                <button type="button" data-rte-command="removeFormat" title="Biçimlendirmeyi kaldır"><span class="material-symbols-outlined">format_clear</span></button>
            </div>
            <div class="rte-popover emoji-picker" id="emoji-picker" hidden aria-label="Emoji seçici">
                <button type="button" th:each="emoji : ${#strings.arraySplit('😀,😂,🤣,😊,😍,😎,🤔,😭,😅,👍,👏,🎉,🔥,❤️,🙏,🤝,🚀,💡,🎯,✅', ',')}" th:text="${emoji}" th:attr="data-rte-emoji=${emoji}"></button>
            </div>
            <div class="rte-popover link-picker" id="link-picker" hidden>
                <label class="visually-hidden" for="rte-link-url">Bağlantı adresi</label>
                <input id="rte-link-url" type="url" placeholder="https://ornek.com" data-rte-link-url>
                <button type="button" data-rte-add-link>Bağlantı ekle</button>
            </div>
            <div class="rte-popover gif-picker" id="gif-picker" hidden aria-label="Komik GIF seçici">
                <button type="button" th:each="gif : ${#strings.arraySplit('3o6Zt481isNVuQI1l6,26ufdipQqU2lhNA4g,3o7TKsQ8UQ2p0f9V8A,3o6Zt6ML6BklcajjsA,3o7btPCcdNniyf0ArS,3o6Zt4HU9uwXmXSAuI,l0MYC0LajbaPoEADu,ICOgUNjpvO0PC,xT9IgG50Fb7Mi0prBC,l0MYt5jPR6QX5pnqM,3oEjHI8WJv4x6UPDB6,26n6WywJyh39n1pBu,3oKIPwoeGErMmaI43S,5GoVLqeAOo6PK,13CoXDiaCcCoyk,2A75RyXVzzSI2bx4Gj,9Ai5dIk8xvBm0,3oEduSbSGpGaRX2Vri,12XDYvMJNcmLgQ,3ohs4w0OrUm5GIkBKE', ',')}" th:attr="data-rte-gif=${'https://media.giphy.com/media/' + gif + '/giphy.gif'}">
                    <img th:src="${'https://media.giphy.com/media/' + gif + '/giphy.gif'}" alt="Komik GIF">
                </button>
            </div>
            <div id="reply-editor" class="rte-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Yanıtınız" data-rte-editor
                 data-placeholder="Bu konuşmaya yanıt yazın..." th:text="*{body}"></div>
            <input id="reply-body" type="hidden" th:field="*{body}" data-rte-input>
            <div class="message-attachments-wrapper">
                <div class="message-upload-actions">
                    <label class="message-image-upload" for="reply-images"><span class="material-symbols-outlined">image</span> Görsel ekle <small>En fazla 2 görsel, 5 MB</small></label>
                    <label class="message-file-upload" for="reply-file"><span class="material-symbols-outlined">attach_file</span> Dosya ekle <small>En fazla 1 dosya, 25 MB</small></label>
                </div>
                <div class="image-preview-container" data-image-preview-container></div>
                <div class="file-preview-container" data-file-preview-container hidden>
                    <div class="file-preview-item">
                        <span class="material-symbols-outlined file-preview-icon">description</span>
                        <div class="file-preview-details">
                            <span class="file-preview-name" data-file-original-name>dosya.pdf</span>
                            <span class="file-preview-size" data-file-size>2.5 MB</span>
                        </div>
                        <div class="file-alias-wrapper">
                            <input type="text" name="fileAlias" class="file-alias-input" placeholder="Dosya takma adı girin..." data-file-alias-input maxlength="100" title="Dosya takma adı">
                        </div>
                        <button type="button" class="file-preview-remove" data-file-remove title="Dosyayı kaldır" aria-label="Dosyayı kaldır">×</button>
                    </div>
                </div>
            </div>
            <input id="reply-images" type="file" name="images" accept="image/jpeg,image/png,image/webp,image/gif" multiple data-message-images>
            <input id="reply-file" type="file" name="file" data-message-file>
            <p class="image-upload-error" hidden data-image-upload-error></p>
            <p class="file-upload-error" hidden data-file-upload-error></p>
            <p th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></p>
        </form>
        <p th:if="${param.replied}" role="status">Yanıtınız gönderildi.</p>
        <p th:if="${param.replyError}" role="alert">Yanıt gönderilemedi.</p>
        <p th:if="${param.reported}" role="status">Mesaj incelemeye alınmak üzere şikayet edildi.</p>
        <p th:if="${param.reportError}" role="alert">Şikayet işlemi tamamlanamadı.</p>
        <div th:if="${!message.draft}" class="message-action-row">
            <button type="submit" form="reply-form"><span class="material-symbols-outlined">send</span> Yanıt gönder</button>
            <form th:if="${!alreadyReported}" th:action="@{/messages/{id}/report(id=${message.id})}" method="post">
                <button type="submit">Mesajı şikayet et</button>
            </form>
        </div>
        <p th:if="${alreadyReported}">Bu mesajı şikayet ettiniz.</p>
        <div th:if="${message.receivedByCurrentUser}" class="message-action-row message-management-actions">
            <form th:action="@{/messages/{id}/category(id=${message.id})}" method="post">
                <label for="categoryId">Kategori</label>
                <select id="categoryId" name="categoryId">
                    <option value="">Kategorisiz</option>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
                            th:selected="${category.id == message.categoryId}"></option>
                </select>
                <button type="submit">Kategoriyi güncelle</button>
            </form>
            <form th:if="${!message.trash}" th:action="@{/messages/{id}/important(id=${message.id})}" method="post">
                <button type="submit" th:text="${message.important ? 'Önem işaretini kaldır' : 'Önemli olarak işaretle'}"></button>
            </form>
            <form th:if="${!message.trash}" th:action="@{/messages/{id}/trash(id=${message.id})}" method="post">
                <button type="submit">Çöp kutusuna taşı</button>
            </form>
            <form th:if="${message.trash}" th:action="@{/messages/{id}/restore(id=${message.id})}" method="post">
                <button type="submit">Çöp kutusundan geri al</button>
            </form>
        </div>
        <div th:unless="${message.receivedByCurrentUser}">
            <form th:if="${!message.trash}" th:action="@{/messages/{id}/trash(id=${message.id})}" method="post">
                <button type="submit">Çöp kutusuna taşı</button>
            </form>
            <form th:if="${message.trash}" th:action="@{/messages/{id}/restore(id=${message.id})}" method="post">
                <button type="submit">Çöp kutusundan geri al</button>
            </form>
        </div>
    </article>
</main>
<script th:src="@{/js/rich-text-editor.js}" defer></script>
<script th:src="@{/js/message-image-upload.js}" defer></script>
</body>
</html>
