<!DOCTYPE html>
<html lang="tr" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${message.subject} + ' | Postera'">Mesaj | Postera</title>
</head>
<body>
<header th:replace="~{fragments/navigation :: mainNavigation}"></header>
<main>
    <article>
        <h1 th:text="${message.subject}"></h1>
        <div class="message-participants">
            <div class="participant-card">
                <img th:src="${message.senderProfileImageUrl != null ? message.senderProfileImageUrl : '/images/default-avatar.svg'}"
                     th:alt="${message.senderName + ' profil fotoğrafı'}">
                <div><span>Gönderen</span><strong th:text="${message.senderName}"></strong><small th:text="${message.senderEmail}"></small></div>
            </div>
            <div class="participant-card">
                <img th:src="${message.receiverProfileImageUrl != null ? message.receiverProfileImageUrl : '/images/default-avatar.svg'}"
                     th:alt="${message.receiverName + ' profil fotoğrafı'}">
                <div><span>Alıcı</span><strong th:text="${message.receiverName}"></strong><small th:text="${message.receiverEmail}"></small></div>
            </div>
        </div>
        <p class="message-sent-at"><time th:text="${#temporals.format(message.sentAt, 'dd.MM.yyyy HH:mm')}"></time></p>
        <section class="conversation" aria-label="Mesaj konuşması">
            <div th:each="item : ${conversation}" class="conversation-message" th:classappend="${item.sentByCurrentUser} ? ' conversation-message-own' : ''">
                <img th:src="${item.senderProfileImageUrl != null ? item.senderProfileImageUrl : '/images/default-avatar.svg'}"
                     th:alt="${item.senderName + ' profil fotoğrafı'}">
                <div class="conversation-bubble">
                    <div><strong th:text="${item.senderName}"></strong><time th:text="${#temporals.format(item.sentAt, 'dd.MM.yyyy HH:mm')}"></time></div>
                    <p th:text="${item.body}"></p>
                </div>
            </div>
        </section>
        <form th:if="${!message.draft}" id="reply-form" class="reply-form" th:action="@{/messages/{id}/reply(id=${message.id})}" th:object="${replyMessageRequest}" method="post">
            <label for="reply-body">Yanıtınız</label>
            <textarea id="reply-body" th:field="*{body}" rows="4" placeholder="Bu konuşmaya yanıt yazın..."></textarea>
            <p th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></p>
        </form>
        <p th:if="${param.replied}" role="status">Yanıtınız gönderildi.</p>
        <p th:if="${param.replyError}" role="alert">Yanıt gönderilemedi.</p>
        <p th:if="${param.reported}" role="status">Mesaj incelemeye alınmak üzere şikayet edildi.</p>
        <p th:if="${param.reportError}" role="alert">Şikayet işlemi tamamlanamadı.</p>
        <div th:if="${!message.draft}" class="message-action-row">
            <button type="submit" form="reply-form"><span class="material-symbols-outlined">send</span> Yanıt gönder</button>
            <form th:if="${!alreadyReported}" th:action="@{/messages/{id}/report(id=${message.id})}" method="post">
                <button type="submit">Mesajı şikayet et</button>
            </form>
        </div>
        <p th:if="${alreadyReported}">Bu mesajı şikayet ettiniz.</p>
        <div th:if="${message.receivedByCurrentUser}" class="message-action-row message-management-actions">
            <form th:action="@{/messages/{id}/category(id=${message.id})}" method="post">
                <label for="categoryId">Kategori</label>
                <select id="categoryId" name="categoryId">
                    <option value="">Kategorisiz</option>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
                            th:selected="${category.id == message.categoryId}"></option>
                </select>
                <button type="submit">Kategoriyi güncelle</button>
            </form>
            <form th:if="${!message.trash}" th:action="@{/messages/{id}/important(id=${message.id})}" method="post">
                <button type="submit" th:text="${message.important ? 'Önem işaretini kaldır' : 'Önemli olarak işaretle'}"></button>
            </form>
            <form th:if="${!message.trash}" th:action="@{/messages/{id}/trash(id=${message.id})}" method="post">
                <button type="submit">Çöp kutusuna taşı</button>
            </form>
            <form th:if="${message.trash}" th:action="@{/messages/{id}/restore(id=${message.id})}" method="post">
                <button type="submit">Çöp kutusundan geri al</button>
            </form>
        </div>
        <div th:unless="${message.receivedByCurrentUser}">
            <form th:if="${!message.trash}" th:action="@{/messages/{id}/trash(id=${message.id})}" method="post">
                <button type="submit">Çöp kutusuna taşı</button>
            </form>
            <form th:if="${message.trash}" th:action="@{/messages/{id}/restore(id=${message.id})}" method="post">
                <button type="submit">Çöp kutusundan geri al</button>
            </form>
        </div>
    </article>
</main>
</body>
</html>
