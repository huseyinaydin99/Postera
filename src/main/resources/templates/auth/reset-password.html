<!DOCTYPE html>
<html lang="tr" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"><link rel="stylesheet" th:href="@{/css/postera.css}"><title>Yeni şifre | Postera</title></head>
<body><main><h1>Yeni şifre belirle</h1><form th:action="@{/auth/reset-password}" th:object="${resetPasswordRequest}" method="post"><input type="hidden" name="token" th:value="${token}"><div th:if="${#fields.hasGlobalErrors()}" role="alert"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div><label for="password">Yeni şifre</label><input id="password" th:field="*{password}" type="password"><p th:errors="*{password}"></p><label for="passwordConfirmation">Şifre tekrarı</label><input id="passwordConfirmation" th:field="*{passwordConfirmation}" type="password"><p th:errors="*{passwordConfirmation}"></p><button type="submit">Şifreyi güncelle</button></form></main></body></html>
