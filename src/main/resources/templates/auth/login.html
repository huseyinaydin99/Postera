<!DOCTYPE html>
<html lang="tr" xmlns:th="https://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/postera.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giriş Yap | Postera</title>
</head>
<body>
<main>
    <section aria-labelledby="login-title">
        <h1 id="login-title">Postera</h1>
        <p>Hesabınıza giriş yapın.</p>
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <form th:action="@{/auth/login}" method="post">
            <div>
                <label for="email">E-posta adresi</label>
                <input id="email" name="email" type="email" autocomplete="email" required autofocus>
            </div>
            <div>
                <label for="password">Şifre</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit">Giriş yap</button>
        </form>
        <p>Henüz hesabınız yok mu? <a th:href="@{/auth/register}">Kayıt olun</a>.</p>
        <p><a th:href="@{/auth/forgot-password}">Şifremi unuttum</a></p>
    </section>
</main>
</body>
</html>
